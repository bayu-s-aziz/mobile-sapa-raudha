name: sapa_raudha
description: "Sistem Informasi Presensi Terpadu Raudhatul Athfal"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  intl: ^0.20.2
  mobile_scanner: ^7.1.3
  file_picker: ^10.3.3
  flutter_svg: ^2.0.10+1 
  google_fonts: ^6.3.2
  image_picker: ^1.2.0
  table_calendar: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
  - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  macos:
    generate: true
    image_path: "assets/images/logo_ra.png" 
  windows:
    generate: true
    image_path: "assets/images/logo_ra.png" 
    icon_size: 256
  web:
    generate: true
    image_path: "assets/images/logo_ra.png" 
  image_path: "assets/images/logo_ra.png" 