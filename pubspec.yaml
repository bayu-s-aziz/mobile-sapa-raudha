name: sapa_raudha
description: "Sistem Informasi Presensi Terpadu Raudhatul Athfal"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.6.6
  intl: ^0.20.2
  mobile_scanner: ^7.1.3
  file_picker: ^10.3.3
  flutter_svg: ^2.0.10+1 
  google_fonts: ^8.0.0
  image_picker: ^1.2.0
  table_calendar: ^3.2.0
  supabase_flutter: ^2.10.3
  shared_preferences: ^2.5.4
  get_storage: ^2.1.1
  flutter_secure_storage: ^10.0.0
  workmanager: ^0.9.0
  flutter_local_notifications: ^20.0.0
  http: ^1.2.0
  pdf: ^3.11.1
  printing: ^5.13.3
  url_launcher: ^6.3.2
  window_manager: ^0.5.1
  web_socket_channel: ^3.0.1
  device_frame: ^1.4.0
  device_preview: ^1.3.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  web: ^1.1.1


flutter:
  uses-material-design: true
  assets:
  - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_ra.png"
  macos:
    generate: true
    image_path: "assets/images/logo_ra.png" 
  windows:
    generate: true
    image_path: "assets/images/logo_ra.png" 
    icon_size: 256
  web:
    generate: true
    image_path: "assets/images/logo_ra.png"